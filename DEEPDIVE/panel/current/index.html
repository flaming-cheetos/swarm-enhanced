<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Enhanced Swarm</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Segoe UI', monospace;
  background: #0d0d0d;
  color: #e0e0e0;
  min-height: 100vh;
}
.header {
  background: #1a1a2e;
  padding: 12px 16px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  border-bottom: 2px solid #4a4aff;
  position: sticky;
  top: 0;
  z-index: 100;
}
.header h1 { font-size: 1.1rem; color: #7b7bff; }
.header .status { font-size: 0.8rem; color: #888; }
.connected { color: #4cff8a !important; }
.layout {
  display: grid;
  grid-template-columns: 1fr;
  gap: 12px;
  padding: 12px;
  max-width: 1400px;
  margin: 0 auto;
}
@media (min-width: 768px) {
  .layout { grid-template-columns: 1fr 1fr; }
}
@media (min-width: 1100px) {
  .layout { grid-template-columns: 1fr 1fr 1fr; }
}
.card {
  background: #1a1a1a;
  border: 1px solid #2a2a2a;
  border-radius: 8px;
  padding: 12px;
}
.card h2 {
  font-size: 0.85rem;
  color: #7b7bff;
  text-transform: uppercase;
  letter-spacing: 1px;
  margin-bottom: 10px;
  border-bottom: 1px solid #2a2a2a;
  padding-bottom: 6px;
}
.bot-card {
  border-left: 3px solid #4cff8a;
  margin-bottom: 8px;
  padding: 10px;
  background: #111;
  border-radius: 6px;
}
.bot-card.offline { border-left-color: #ff4c4c; }
.bot-name {
  font-size: 0.95rem;
  font-weight: bold;
  color: #fff;
  display: flex;
  align-items: center;
  gap: 6px;
}
.dot { font-size: 0.7rem; }
.dot.online { color: #4cff8a; }
.dot.offline { color: #ff4c4c; }
.bot-stats {
  display: flex;
  gap: 12px;
  margin: 4px 0;
  font-size: 0.8rem;
  color: #aaa;
}
.bot-task {
  font-size: 0.82rem;
  color: #ccc;
  margin: 4px 0;
}
.bot-progress {
  font-size: 0.8rem;
  color: #7b7bff;
}
.bot-coords {
  font-size: 0.75rem;
  color: #666;
  font-family: monospace;
}
.bot-actions {
  display: flex;
  gap: 4px;
  margin-top: 6px;
}
.nick-input {
  background: #222;
  border: 1px solid #333;
  color: #fff;
  padding: 3px 6px;
  border-radius: 4px;
  font-size: 0.75rem;
  width: 80px;
}
.tier-badge {
  display: inline-block;
  padding: 1px 6px;
  border-radius: 3px;
  font-size: 0.7rem;
  font-weight: bold;
}
.tier-WOOD { background: #5c3d1e; color: #d4a054; }
.tier-STONE { background: #3a3a3a; color: #aaa; }
.tier-IRON { background: #2a3a4a; color: #88aacc; }
.tier-DIAMOND { background: #0d2a3a; color: #4ae8ff; }
.tier-NETHERITE { background: #2a1a2a; color: #cc88ff; }
.task-item {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 8px;
  background: #111;
  border-radius: 6px;
  margin-bottom: 6px;
  font-size: 0.82rem;
}
.task-info { flex: 1; }
.task-name { color: #fff; font-weight: bold; }
.task-meta { color: #888; font-size: 0.75rem; }
.task-status {
  padding: 2px 6px;
  border-radius: 3px;
  font-size: 0.7rem;
  margin: 0 6px;
}
.status-ACTIVE { background: #1a3a1a; color: #4cff8a; }
.status-PENDING { background: #2a2a1a; color: #ffcc44; }
.status-COMPLETE { background: #1a1a3a; color: #7b7bff; }
.status-FAILED { background: #3a1a1a; color: #ff4c4c; }
.add-task {
  display: grid;
  grid-template-columns: 1fr 60px 1fr auto;
  gap: 6px;
  margin-top: 10px;
}
input, select {
  background: #222;
  border: 1px solid #333;
  color: #fff;
  padding: 6px 8px;
  border-radius: 4px;
  font-size: 0.82rem;
  width: 100%;
}
input:focus, select:focus {
  outline: none;
  border-color: #7b7bff;
}
button {
  background: #2a2a4a;
  color: #7b7bff;
  border: 1px solid #4a4aff;
  padding: 6px 10px;
  border-radius: 4px;
  cursor: pointer;
  font-size: 0.8rem;
  transition: all 0.15s;
  white-space: nowrap;
}
button:hover { background: #3a3a6a; color: #fff; }
button.danger { background: #3a1a1a; color: #ff4c4c; border-color: #ff4c4c; }
button.danger:hover { background: #5a2a2a; }
button.success { background: #1a3a1a; color: #4cff8a; border-color: #4cff8a; }
button.success:hover { background: #2a5a2a; }
button.warn { background: #3a2a1a; color: #ffaa44; border-color: #ffaa44; }
button.warn:hover { background: #5a3a1a; }
button:disabled { background: #151515; color: #666; border-color: #333; cursor: not-allowed; }
button:disabled:hover { background: #151515; color: #666; }
.footer { grid-column: 1 / -1; text-align: center; color: #555; font-size: 0.72rem; padding: 10px 0 4px; }
.footer .meta { color: #7b7bff; }
.actions-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 6px;
}
.cmd-row {
  display: flex;
  gap: 6px;
  margin-top: 8px;
}
.cmd-row input { flex: 1; }
.log-panel {
  grid-column: 1 / -1;
  max-height: 300px;
}
.log-entries {
  height: 250px;
  overflow-y: auto;
  font-family: monospace;
  font-size: 0.75rem;
  background: #080808;
  border-radius: 4px;
  padding: 8px;
  border: 1px solid #1a1a1a;
}
.log-entry { padding: 2px 0; border-bottom: 1px solid #111; }
.log-entry .time { color: #444; margin-right: 6px; }
.log-INFO .msg { color: #ccc; }
.log-WARN .msg { color: #ffaa44; }
.log-ERROR .msg { color: #ff4c4c; }
.log-entry .level-INFO { color: #4cff8a; }
.log-entry .level-WARN { color: #ffaa44; }
.log-entry .level-ERROR { color: #ff4c4c; }
.log-controls {
  display: flex;
  gap: 6px;
  margin-bottom: 6px;
  align-items: center;
}
.log-filter { flex: 1; }
::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: #111; }
::-webkit-scrollbar-thumb { background: #333; border-radius: 3px; }
.hp-bar {
  height: 3px;
  background: #222;
  border-radius: 2px;
  margin: 3px 0;
  overflow: hidden;
}
.hp-fill { height: 100%; background: #4cff8a; border-radius: 2px; transition: width 0.5s; }
.food-fill { background: #ffaa44; }
.ws-indicator {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: #ff4c4c;
  display: inline-block;
  margin-right: 4px;
}
.ws-indicator.connected { background: #4cff8a; }
</style>
</head>
<body>

<div class="header">
  <h1>⚡ Enhanced Swarm</h1>
  <div class="status">
    <span class="ws-indicator" id="wsIndicator"></span>
    <span id="wsStatus">Connecting...</span>
    &nbsp;|&nbsp;
    <span id="connectedCount">0</span> bots online
  </div>
</div>

<div class="layout" id="layout">
  <!-- Bots section -->
  <div class="card" id="botsCard">
    <h2>🤖 Workers</h2>
    <div id="botsList">
      <div style="color:#555;font-size:0.82rem;">No bots connected</div>
    </div>
  </div>

  <!-- Tasks section -->
  <div class="card" id="tasksCard">
    <h2>📋 Task Queue</h2>
    <div id="tasksList">
      <div style="color:#555;font-size:0.82rem;">No tasks</div>
    </div>
    <div class="add-task" style="margin-top:10px;">
      <input id="taskItem" placeholder="item (e.g. cobblestone)" type="text">
      <input id="taskQty" placeholder="qty" type="number" value="64">
      <select id="taskType">
        <option value="AUTO">Auto</option>
        <option value="CRAFT">Craft</option>
        <option value="GATHER">Gather</option>
        <option value="HUNT_FOOD">Hunt food</option>
        <option value="GRIND">Grind</option>
        <option value="SMITH">Smith</option>
        <option value="BUILD">Build</option>
      </select>
      <select id="taskBot">
        <option value="any">Any bot</option>
      </select>
      <button class="success" id="addTaskButton" title="Queue a task (/api/task/add)">+ Add</button>
    </div>
    <div style="margin-top:8px;">
      <button id="clearDoneButton" title="Remove COMPLETE and FAILED tasks (/api/task/clear_done)">Clear Done/Failed</button>
    </div>
  </div>

  <!-- Quick Actions -->
  <div class="card">
    <h2>⚡ Quick Actions</h2>
    <div class="actions-grid">
      <button id="followButton" data-action="follow" title="swarm:all follow player &lt;your player name&gt;">👥 Follow Me</button>
      <button class="danger" data-action="cancel" title="swarm:all cancel">🛑 Stop All</button>
      <button class="success" data-action="resume" title="swarm:all resume">▶ Resume All</button>
      <button data-action="deposit" title="swarm:all depositall">📦 Deposit All</button>
      <button data-action="deposit_ores" title="swarm:all deposit ores">⛏ Dep. Ores</button>
      <button data-action="deposit_shulkers" title="swarm:all deposit shulkers">📫 Dep. Shulkers</button>
      <button disabled title="Not implemented: needs the container reader. This control sends no request.">🔍 Scan Chests (unavailable)</button>
      <button disabled title="Not implemented: needs the container reader. This control sends no request.">🔥 Check Fuel (unavailable)</button>
      <button class="success" data-action="pvp_on" title="exec .toggle crystal-aura on; exec .toggle kill-aura on; exec .toggle auto-totem on; exec .toggle surround on; exec .toggle auto-trap on; exec .toggle auto-web on; exec .toggle auto-exp on">⚔ PVP ON</button>
      <button class="danger" data-action="pvp_off" title="exec .toggle crystal-aura off; exec .toggle kill-aura off; exec .toggle auto-totem off; exec .toggle surround off; exec .toggle auto-trap off; exec .toggle auto-web off; exec .toggle auto-exp off">🕊 PVP OFF</button>
    </div>
    <div style="margin-top:10px;">
      <h2 style="margin-bottom:6px;">💬 Send Command</h2>
      <div class="cmd-row">
        <select id="cmdTarget" style="width:100px;flex:none;">
          <option value="all">All</option>
        </select>
        <input id="cmdInput" placeholder="command..." type="text" title="Type a command; Send wraps it in exec">
        <button id="sendButton" title="exec &lt;command from the box&gt;">Send</button>
      </div>
    </div>
  </div>

  <!-- Log Panel (full width) -->
  <div class="card log-panel">
    <h2>📜 Live Log</h2>
    <div class="log-controls">
      <input class="log-filter" id="logFilter" placeholder="Filter logs..." title="Filter visible log lines by text"
             type="text">
      <button id="clearLogsButton" title="Clear the visible log (no server request)">Clear</button>
      <label style="font-size:0.75rem;color:#888;display:flex;align-items:center;gap:4px;">
        <input type="checkbox" id="autoScroll" checked title="Keep the newest log line visible"> Auto-scroll
      </label>
    </div>
    <div class="log-entries" id="logEntries"></div>
  </div>

  <div class="footer">
    Enhanced Swarm <span class="meta" id="modVersion">version unknown</span>
    &nbsp;·&nbsp; built from <span class="meta" id="buildCommit">commit unknown</span>
  </div>
</div>

<script src="/app.js"></script>
</body>
</html>
